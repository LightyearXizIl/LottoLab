name: Release LottoLab

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows-draft:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify frontend
        run: npm run build && npm run test
      - name: Confirm updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD are required for a release.'
          }
      - name: Build signed Windows installer as draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LottoLab ${{ github.ref_name }}"
          releaseBody: "LottoLab v0.0.2：新增三档主题、安卓原生风界面和签名 Windows 自动更新引导。历史评分不等于中奖概率；所有合法号码组合的理论中奖机会相同。"
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
      - name: Upload signed updater manifest and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleDir = 'src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem $bundleDir -Filter '*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Expected NSIS installer was not built.' }
          # Tauri v2 reuses the signed NSIS installer as its updater artifact.
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) { throw 'Updater signature was not built.' }
          $tag = '${{ github.ref_name }}'
          $signature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
          $manifest = @{
            version = $tag.TrimStart('v')
            notes = "LottoLab $tag"
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            platforms = @{
              'windows-x86_64' = @{
                url = "https://github.com/LightyearXizIl/LottoLab/releases/download/$tag/$($installer.Name)"
                signature = $signature
              }
            }
          }
          $manifestPath = Join-Path $bundleDir 'latest.json'
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          $checksumPath = Join-Path $bundleDir 'SHA256SUMS.txt'
          @($installer, (Get-Item -LiteralPath $signaturePath), (Get-Item -LiteralPath $manifestPath)) | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -LiteralPath $checksumPath -Encoding utf8
          gh release upload $tag $installer.FullName $signaturePath $manifestPath $checksumPath --clobber
